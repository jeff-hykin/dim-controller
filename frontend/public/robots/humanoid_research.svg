<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.5 5.5 53 53" width="64" height="64" role="img" aria-label="Humanoid">
  <!-- dimOS robot-type icon (research): app icon set v6 treatment, gradient glyph, bloom, logo scan lines -->
  <defs>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.8"/></filter>
    <linearGradient id="a" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="54.5"><stop offset="0" stop-color="#5a6ff2"/><stop offset="1" stop-color="#293ce4"/></linearGradient>
    
    <g id="glyph"><g transform="translate(32 32) scale(0.8172) translate(-32.00 -31.25)"><g>
      <rect x="27" y="9.5" width="10" height="10.5" rx="4" fill="none" stroke="url(#a)" stroke-width="3.67" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M29.5 14.25H34.5" fill="none" stroke="url(#a)" stroke-width="2.69" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M24 23.5H40Q42 23.5 41.6 25.5L39.5 36H24.5L22.4 25.5Q22 23.5 24 23.5Z" fill="none" stroke="url(#a)" stroke-width="3.67" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M21.5 25L18 33.5L19.5 40.5" fill="none" stroke="url(#a)" stroke-width="3.67" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M42.5 25L46 33.5L44.5 40.5" fill="none" stroke="url(#a)" stroke-width="3.67" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M28 36.5L27 44.5L27.5 53" fill="none" stroke="url(#a)" stroke-width="3.67" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M36 36.5L37 44.5L36.5 53" fill="none" stroke="url(#a)" stroke-width="3.67" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M32 20.5V23" fill="none" stroke="url(#a)" stroke-width="2.69" stroke-linecap="round" stroke-linejoin="round"/>
    </g></g></g>
    <linearGradient id="scanrow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#ebebeb"/><stop offset=".5" stop-color="#d6d6d6"/><stop offset=".75" stop-color="#ebebeb"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <pattern id="scan" width="64" height="3.6" patternUnits="userSpaceOnUse"><rect width="64" height="3.6" fill="url(#scanrow)"/></pattern>
    <mask id="scanlines" maskUnits="userSpaceOnUse" x="-16" y="-16" width="96" height="96"><rect x="-16" y="-16" width="96" height="96" fill="url(#scan)"/></mask>
    
  </defs>
  <g transform="translate(32 32) scale(1.12) translate(-32 -32)">
    <use href="#glyph" filter="url(#bloom)" opacity="0.35"/>
    <g mask="url(#scanlines)"><use href="#glyph"/></g>
  </g>
</svg>
