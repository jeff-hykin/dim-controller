<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.5 5.5 53 53" width="64" height="64" role="img" aria-label="Wheeled base">
  <!-- dimOS robot-type icon (research): app icon set v6 treatment, gradient glyph, bloom, logo scan lines -->
  <defs>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.8"/></filter>
    <linearGradient id="a" gradientUnits="userSpaceOnUse" x1="0" y1="14.5" x2="0" y2="51.5"><stop offset="0" stop-color="#5a6ff2"/><stop offset="1" stop-color="#293ce4"/></linearGradient>
    
    <g id="glyph"><g transform="translate(32 32) scale(0.8444) translate(-32.00 -33.00)"><g>
      <rect x="11" y="29" width="42" height="10.5" rx="2.5" fill="none" stroke="url(#a)" stroke-width="3.55" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20.5" cy="44.5" r="5.5" fill="none" stroke="url(#a)" stroke-width="3.55" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="43.5" cy="44.5" r="5.5" fill="none" stroke="url(#a)" stroke-width="3.55" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="20.5" cy="44.5" r="1.4" fill="url(#a)"/>
      <circle cx="43.5" cy="44.5" r="1.4" fill="url(#a)"/>
      <path d="M32 29V22" fill="none" stroke="url(#a)" stroke-width="3.55" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26.5" y="16" width="11" height="6" rx="2" fill="none" stroke="url(#a)" stroke-width="2.61" stroke-linecap="round" stroke-linejoin="round"/>
    </g></g></g>
    <linearGradient id="scanrow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#ebebeb"/><stop offset=".5" stop-color="#d6d6d6"/><stop offset=".75" stop-color="#ebebeb"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <pattern id="scan" width="64" height="3.6" patternUnits="userSpaceOnUse"><rect width="64" height="3.6" fill="url(#scanrow)"/></pattern>
    <mask id="scanlines" maskUnits="userSpaceOnUse" x="-16" y="-16" width="96" height="96"><rect x="-16" y="-16" width="96" height="96" fill="url(#scan)"/></mask>
    
  </defs>
  <g transform="translate(32 32) scale(1.12) translate(-32 -32)">
    <use href="#glyph" filter="url(#bloom)" opacity="0.35"/>
    <g mask="url(#scanlines)"><use href="#glyph"/></g>
  </g>
</svg>
