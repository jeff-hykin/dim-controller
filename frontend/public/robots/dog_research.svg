<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.5 5.5 53 53" width="64" height="64" role="img" aria-label="Robot dog">
  <!-- dimOS robot-type icon (research): app icon set v6 treatment, gradient glyph, bloom, logo scan lines -->
  <defs>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.8"/></filter>
    <linearGradient id="a" gradientUnits="userSpaceOnUse" x1="0" y1="19.5" x2="0" y2="49.5"><stop offset="0" stop-color="#5a6ff2"/><stop offset="1" stop-color="#293ce4"/></linearGradient>
    
    <g id="glyph"><g transform="translate(32 32) scale(0.9048) translate(-33.50 -34.50)"><g>
      <rect x="14" y="23.5" width="31" height="9.5" rx="3" fill="none" stroke="url(#a)" stroke-width="3.32" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M45 25.5H50.5Q53 25.5 53 28V29.5Q53 32 50.5 32H45" fill="none" stroke="url(#a)" stroke-width="3.32" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M46.5 25.5V22.5Q46.5 21 48 21H49.5Q51 21 51 22.5V25.5" fill="none" stroke="url(#a)" stroke-width="2.43" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M41 31.5L36.5 39.5L41.5 47.5" fill="none" stroke="url(#a)" stroke-width="3.32" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M19 31.5L14.5 39.5L19.5 47.5" fill="none" stroke="url(#a)" stroke-width="3.32" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="41.8" cy="47.6" r="1.8" fill="url(#a)"/>
      <circle cx="19.8" cy="47.6" r="1.8" fill="url(#a)"/>
    </g></g></g>
    <linearGradient id="scanrow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#ebebeb"/><stop offset=".5" stop-color="#d6d6d6"/><stop offset=".75" stop-color="#ebebeb"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <pattern id="scan" width="64" height="3.6" patternUnits="userSpaceOnUse"><rect width="64" height="3.6" fill="url(#scanrow)"/></pattern>
    <mask id="scanlines" maskUnits="userSpaceOnUse" x="-16" y="-16" width="96" height="96"><rect x="-16" y="-16" width="96" height="96" fill="url(#scan)"/></mask>
    
  </defs>
  <g transform="translate(32 32) scale(1.12) translate(-32 -32)">
    <use href="#glyph" filter="url(#bloom)" opacity="0.35"/>
    <g mask="url(#scanlines)"><use href="#glyph"/></g>
  </g>
</svg>
