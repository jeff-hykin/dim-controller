<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>point cloud benchmark</title>
<style>html, body { margin: 0; height: 100%; background: #06090f; color: #d8e6f4; font: 12px monospace; } canvas { display: block; }</style>
</head>
<body>
<!-- Development only (not in the app build): frame time for a big cloud through the real point material.
     ?points=10000000&style=disc|square|voxel&size=0.05 ; results land in window.__bench -->
<script type="module">
import * as THREE from "three"
import { applyLook, makePointMaterial } from "./src/core/render/pointMaterial.ts"

const query = new URLSearchParams(location.search)
const count = Number(query.get("points") ?? 10_000_000)
const style = query.get("style") ?? "disc"
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" })
renderer.setPixelRatio(devicePixelRatio)
renderer.setSize(innerWidth, innerHeight)
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 1000)
camera.up.set(0, 0, 1)
const pixelsPerMeter = { value: (innerHeight * devicePixelRatio) / (2 * Math.tan(THREE.MathUtils.degToRad(30))) }

// a building-sized cloud: floors, walls and noise, the shape a lidar map has
const positions = new Float32Array(count * 3)
for (let index = 0; index < count; index++) {
    const kind = index % 4
    const x = (Math.random() - 0.5) * 40, y = (Math.random() - 0.5) * 30
    positions[index * 3] = kind === 2 ? Math.round(x / 8) * 8 + (Math.random() - 0.5) * 0.1 : x
    positions[index * 3 + 1] = kind === 3 ? Math.round(y / 6) * 6 + (Math.random() - 0.5) * 0.1 : y
    positions[index * 3 + 2] = kind < 2 ? Math.floor(Math.random() * 3) * 3 + (Math.random() - 0.5) * 0.05 : Math.random() * 9
}
const geometry = new THREE.BufferGeometry()
geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3))
// whichever per-point attributes this version of the material declares
const source = makePointMaterial(pixelsPerMeter)
const attributes = [...source.vertexShader.matchAll(/attribute\s+(\w+)\s+(\w+);/g)].map((match) => [match[1], match[2]])
let bytesPerPoint = 12
for (const [type, name] of attributes) {
    const array = name === "aIntensity" && query.get("intensity") === "u8" ? new Uint8Array(count) : new Float32Array(count)
    geometry.setAttribute(name, new THREE.BufferAttribute(array, type === "float" ? 1 : 3))
    bytesPerPoint += array.BYTES_PER_ELEMENT * (type === "float" ? 1 : 3)
}
const material = source
applyLook(material, { style, size: Number(query.get("size") ?? 0.05), colorMode: "height", gradient: "turbo", axis: 2, rangeMin: null, rangeMax: null, solid: "#ffffff", opacity: 1 }, [0, 9])
const points = new THREE.Points(geometry, material)
points.frustumCulled = false
scene.add(points)

const gl = renderer.getContext()
const pixel = new Uint8Array(4)
const times = []
let frame = 0
const angle = { value: 0 }
function tick() {
    angle.value += 0.01
    camera.position.set(Math.cos(angle.value) * 35, Math.sin(angle.value) * 35, 22)
    camera.lookAt(0, 0, 3)
    const started = performance.now()
    renderer.render(scene, camera)
    // reading a pixel back waits for the GPU to finish the frame (gl.finish doesn't, in Chrome), so this is its real cost
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel)
    const elapsed = performance.now() - started
    if (frame++ > 10) {
        times.push(elapsed)
    }
    if (times.length < 60) {
        requestAnimationFrame(tick)
    } else {
        times.sort((a, b) => a - b)
        window.__bench = { count, style, bytesPerPoint, attributes: attributes.map(([type, name]) => `${type} ${name}`), p50: times[30], p90: times[54], mean: times.reduce((a, b) => a + b, 0) / times.length }
        document.body.insertAdjacentHTML("beforeend", `<pre style="position:fixed;top:8px;left:8px">${JSON.stringify(window.__bench, null, 1)}</pre>`)
    }
}
requestAnimationFrame(tick)
</script>
</body>
</html>
