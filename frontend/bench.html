<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>point cloud benchmark</title>
<style>html, body { margin: 0; height: 100%; background: #06090f; color: #d8e6f4; font: 12px monospace; } canvas { display: block; }</style>
</head>
<body>
<!-- Development only (not in the app build): frame time for a big cloud through the real point material.
     ?points=10000000&style=splat|voxel|disc|square&size=0.05&aa=0|1&cloud=gallery_cloud.txt ; results in window.__bench.
     cloud=: the shader gallery's page (copied next to this file), for its real MID-360 voxels and camera -->
<script type="module">
import * as THREE from "three"
import * as pointShaders from "./src/core/render/pointMaterial.ts"
const { applyLook, makePointMaterial } = pointShaders

const query = new URLSearchParams(location.search)
const count = Number(query.get("points") ?? 10_000_000)
const style = query.get("style") ?? "disc"
const renderer = new THREE.WebGLRenderer({ antialias: query.get("aa") !== "0", powerPreference: "high-performance" })
renderer.setPixelRatio(devicePixelRatio)
renderer.setSize(innerWidth, innerHeight)
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 1000)
camera.up.set(0, 0, 1)
const pixelsPerMeter = { value: (innerHeight * devicePixelRatio) / (2 * Math.tan(THREE.MathUtils.degToRad(query.get("cloud") ? 25 : 30))) }

// the cloud: ?cloud=<url of the shader gallery> uses the gallery's real MID-360 voxels and its camera (repeated and
// jittered like its own benchmark), so both measure the same scene; otherwise a synthetic building
let positions
let fixedCamera = null
const galleryUrl = query.get("cloud")
if (galleryUrl) {
    const html = await (await fetch(galleryUrl)).text()
    const meta = JSON.parse(html.match(/const META = (\{.*\})/)[1])
    const raw = Uint8Array.from(atob(html.match(/const DATA_B64 = "([^"]+)"/)[1]), (c) => c.charCodeAt(0))
    const indices = new Int16Array(raw.buffer)
    const base = indices.length / 3
    const real = new Float32Array(base * 3)
    for (let i = 0; i < base * 3; i++) {
        real[i] = (indices[i] + 0.5) * meta.voxel + meta.origin[i % 3]
    }
    positions = new Float32Array(count * 3)
    let seed = 12345
    const random = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296 }
    for (let i = 0; i < count; i++) {
        const source = (i % base) * 3
        const jitter = Math.floor(i / base) === 0 ? 0 : meta.voxel
        for (let axis = 0; axis < 3; axis++) {
            positions[i * 3 + axis] = real[source + axis] + (random() - 0.5) * 2 * jitter
        }
    }
    const bounds = new THREE.Box3().setFromArray(real)
    const centre = bounds.getCenter(new THREE.Vector3())
    const size = bounds.getSize(new THREE.Vector3())
    const reach = Math.max(size.x, size.y) * meta.distance
    camera.fov = 50
    camera.updateProjectionMatrix()
    fixedCamera = { position: new THREE.Vector3(centre.x + reach * meta.view[0], centre.y + reach * meta.view[1], centre.z + reach * meta.view[2]), target: centre, reach }
} else {
    positions = new Float32Array(count * 3)
    for (let index = 0; index < count; index++) {
        const kind = index % 4
        const x = (Math.random() - 0.5) * 40, y = (Math.random() - 0.5) * 30
        positions[index * 3] = kind === 2 ? Math.round(x / 8) * 8 + (Math.random() - 0.5) * 0.1 : x
        positions[index * 3 + 1] = kind === 3 ? Math.round(y / 6) * 6 + (Math.random() - 0.5) * 0.1 : y
        positions[index * 3 + 2] = kind < 2 ? Math.floor(Math.random() * 3) * 3 + (Math.random() - 0.5) * 0.05 : Math.random() * 9
    }
}
const geometry = new THREE.BufferGeometry()
geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3))
// whichever per-point attributes this version of the material declares
const source = makePointMaterial(pixelsPerMeter)
const attributes = [...source.vertexShader.matchAll(/attribute\s+(\w+)\s+(\w+);/g)].map((match) => [match[1], match[2]])
let bytesPerPoint = 12
for (const [type, name] of attributes) {
    const array = name === "aIntensity" && query.get("intensity") === "u8" ? new Uint8Array(count) : new Float32Array(count)
    geometry.setAttribute(name, new THREE.BufferAttribute(array, type === "float" ? 1 : 3))
    bytesPerPoint += array.BYTES_PER_ELEMENT * (type === "float" ? 1 : 3)
}
const material = source
applyLook(material, { style, size: Number(query.get("size") ?? 0.05), colorMode: "height", gradient: "memworld", axis: 2, rangeMin: null, rangeMax: null, solid: "#ffffff", opacity: 1 }, [-4.4, 4.1])
// the viewer's splat budget (3M) unless ?budget= says otherwise
if (material.uniforms.uKeep) {
    material.uniforms.uKeep.value = Math.min(1, Number(query.get("budget") ?? 3_000_000) / count)
}
material.uniforms.uSize.value *= Number(query.get("scale") ?? 1)
const points = new THREE.Points(geometry, material)
points.frustumCulled = false
scene.add(points)

const gl = renderer.getContext()
const pixel = new Uint8Array(4)
// the fixed cost of the read-back itself, measured on an empty frame and subtracted
let readbackMs = 0
{
    const samples = []
    for (let index = 0; index < 20; index++) {
        const started = performance.now()
        gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel)
        samples.push(performance.now() - started)
    }
    readbackMs = samples.sort((a, b) => a - b)[10]
}
const times = []
let frame = 0
const angle = { value: 0 }
function tick() {
    if (fixedCamera) {
        camera.position.copy(fixedCamera.position)
        camera.lookAt(fixedCamera.target)
    } else {
        angle.value += 0.01
        camera.position.set(Math.cos(angle.value) * 35, Math.sin(angle.value) * 35, 22)
        camera.lookAt(0, 0, 3)
    }
    if (pointShaders.focusDistance) {
        pointShaders.focusDistance.value = camera.position.length()
    }
    const started = performance.now()
    renderer.render(scene, camera)
    // reading a pixel back waits for the GPU to finish the frame (gl.finish doesn't, in Chrome), so this is its real cost
    gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel)
    const elapsed = performance.now() - started - readbackMs
    if (frame++ > 10) {
        times.push(elapsed)
    }
    if (times.length < 60) {
        requestAnimationFrame(tick)
    } else {
        times.sort((a, b) => a - b)
        window.__bench = { count, style, bytesPerPoint, attributes: attributes.map(([type, name]) => `${type} ${name}`), p50: times[30], p90: times[54], mean: times.reduce((a, b) => a + b, 0) / times.length }
        document.body.insertAdjacentHTML("beforeend", `<pre style="position:fixed;top:8px;left:8px">${JSON.stringify(window.__bench, null, 1)}</pre>`)
    }
}
requestAnimationFrame(tick)
</script>
</body>
</html>
