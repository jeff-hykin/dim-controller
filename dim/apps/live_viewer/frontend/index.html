<!doctype html>
<!--
  Live Viewer. A PimSim-style 3D scene for a LIVE DimOS stack: the robot body +
  pose/trail (odometry), lidar & costmap point clouds placed via the TF tree,
  the planned path, and a first-person camera PIP. Backend (main.js) discovers
  the streams on the bridge and feeds decoded frames.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Viewer · DimOS</title>
<link rel="stylesheet" href="/assets/theme.css" />
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; font-family: var(--sans); }
  #scene { position: absolute; inset: 0;
    background: radial-gradient(125% 95% at 50% 0%, oklch(0.99 0.002 250) 0%, oklch(0.955 0.004 250) 46%, oklch(0.9 0.006 252) 100%); }
  body.dark #scene {
    background: radial-gradient(120% 90% at 50% 0%, oklch(0.28 0.03 250) 0%, oklch(0.19 0.02 256) 42%, oklch(0.13 0.015 258) 100%); }
  #scene canvas { display: block; }

  .topbar { position: absolute; top: 0; left: 0; right: 0; height: 48px; z-index: 5;
    display: flex; align-items: center; gap: 10px; padding: 0 16px;
    border-bottom: 1px solid var(--border); background: color-mix(in oklch, var(--card) 82%, transparent);
    backdrop-filter: blur(10px); box-shadow: var(--shadow-xs); cursor: pointer; user-select: none; }
  .topbar .chev { color: var(--muted-fg); font-size: 10px; transition: transform .15s; }
  body.panel-hidden .topbar .chev { transform: rotate(-90deg); }
  body.panel-hidden .panel { display: none; }
  .topbar .brand { width: 22px; height: 22px; flex: none; }
  .topbar .title { font-size: 14px; font-weight: 650; letter-spacing: 0.02em; color: var(--fg); }
  .topbar .sub { font-size: 11px; color: var(--muted-fg); letter-spacing: 0.02em; }
  .topbar .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px;
    color: var(--muted-fg); border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
    background: color-mix(in oklch, var(--card) 60%, transparent); }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted-fg); transition: background .3s; }
  .pill.on { color: color-mix(in oklch, var(--info) 70%, var(--fg)); border-color: color-mix(in oklch, var(--info) 35%, var(--border)); }
  .pill.on .dot { background: var(--info); box-shadow: 0 0 0 3px color-mix(in oklch, var(--info) 22%, transparent); }

  .panel { position: absolute; top: 60px; left: 12px; width: 288px; z-index: 4;
    background: color-mix(in oklch, var(--card) 90%, transparent); border: 1px solid var(--border);
    border-radius: var(--radius-lg); box-shadow: var(--shadow-md); backdrop-filter: blur(10px);
    padding: 12px 12px 14px; font-size: 12px; max-height: calc(100% - 84px); overflow: auto; }
  .panel h2 { margin: 0 0 6px; font-size: 9.5px; letter-spacing: var(--track-label); text-transform: uppercase;
    color: var(--muted-fg); font-weight: 700; }
  .panel h2:not(:first-child) { margin-top: 15px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 3px 2px; border-radius: var(--radius-sm); }
  .row:hover { background: var(--accent); }
  .row label { display: flex; align-items: center; gap: 8px; cursor: pointer; flex: 1; min-width: 0; }
  .row .nm { font-family: var(--mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .tag { display: inline-flex; align-items: center; gap: 5px; font-size: 8.5px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--secondary-fg);
    background: var(--secondary); border-radius: 999px; padding: 2px 7px; flex: none; }
  .row .tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--kc, var(--muted-fg)); }
  .kc-cloud { --kc: oklch(0.72 0.13 210); }   /* lidar/cloud — cyan */
  .kc-odom  { --kc: oklch(0.78 0.14 70); }    /* odometry — amber */
  .kc-path  { --kc: oklch(0.78 0.18 145); }   /* path — green */
  .kc-image { --kc: oklch(0.68 0.15 300); }   /* camera — violet */
  .kc-tf    { --kc: oklch(0.7 0.02 260); }    /* tf — grey */
  .empty { color: var(--muted-fg); padding: 4px 2px; }
  input[type=checkbox] { accent-color: var(--primary); }
  select { width: 100%; appearance: none; font: inherit; font-size: 12px; color: var(--fg); cursor: pointer;
    background: var(--card); border: 1px solid var(--input); border-radius: var(--radius); padding: 6px 9px; margin-top: 4px; }
  .row select.grad-pick { width: 78px; flex: none; font-size: 10px; padding: 2px 5px; margin: 0; }
  .row select.axis-pick { width: 38px; }
  .legend { display: grid; gap: 5px; margin-top: 2px; }
  .legend .li { display: flex; align-items: center; gap: 8px; color: var(--secondary-fg); font-size: 11px; }
  .legend .sw { width: 14px; height: 3px; border-radius: 2px; flex: none; }
  .legend .sw.dot { width: 9px; height: 9px; border-radius: 50%; }

  .cam { position: absolute; z-index: 4; width: 300px;
    border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
    background: color-mix(in oklch, var(--card) 90%, transparent); overflow: hidden; backdrop-filter: blur(10px); }
  .cam .cam-head { font-size: 9px; letter-spacing: var(--track-label); text-transform: uppercase; color: var(--muted-fg);
    padding: 7px 11px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 7px; font-weight: 700;
    cursor: grab; user-select: none; touch-action: none; }
  .cam .cam-head::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: oklch(0.68 0.15 300);
    box-shadow: 0 0 0 3px color-mix(in oklch, oklch(0.68 0.15 300) 22%, transparent); flex: none; }
  .cam .cam-head .fold-chev { margin-left: auto; opacity: 0.6; transition: transform 0.15s; }
  .cam.folded .cam-head { border-bottom: none; }
  .cam.folded .cam-head .fold-chev { transform: rotate(-90deg); }
  .cam canvas { display: block; width: 100%; background: oklch(0.14 0.015 258); }
  .cam.folded canvas, .cam.folded .cam-resize { display: none; }
  .cam .cam-resize { position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize; touch-action: none;
    background: linear-gradient(135deg, transparent 55%, color-mix(in oklch, var(--muted-fg) 55%, transparent) 55%); }

  #help { position: absolute; bottom: 14px; left: 16px; z-index: 4; color: var(--muted-fg); opacity: 0.6;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; user-select: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://esm.sh/three@0.160.0" } }
</script>
</head>
<body class="science">
<script>
  (function () { const m = matchMedia("(prefers-color-scheme: light)");
    const a = () => document.body.classList.toggle("dark", !m.matches); a(); m.addEventListener("change", a) })()
</script>

<div id="scene"></div>

<div class="topbar" id="topbar" title="Toggle panel">
  <img class="brand" src="icon.svg" alt="" />
  <span class="title">Live&nbsp;Viewer</span>
  <span class="sub">· live DimOS scene</span>
  <span class="chev">▼</span>
  <span class="spacer"></span>
  <span class="pill" id="pill"><span class="dot" id="dot"></span><span id="stat">connecting…</span></span>
</div>

<div class="panel">
  <h2>Streams</h2>
  <div id="stream-list"><div class="empty">none yet</div></div>
  <h2>Legend</h2>
  <div class="legend">
    <div class="li"><span class="sw dot" style="background:oklch(0.78 0.14 70)"></span>robot pose &amp; body</div>
    <div class="li"><span class="sw" style="background:oklch(0.72 0.13 210)"></span>odometry trail</div>
    <div class="li"><span class="sw" style="background:oklch(0.78 0.18 145)"></span>planned path</div>

  </div>
</div>

<div id="help">WASD MOVE · Q/E DOWN/UP · DRAG LOOK · ALT-DRAG PAN · SCROLL DOLLY · RIGHT-DRAG PAN · DBLCLICK RECENTER<span id="campos"></span></div>

<script type="module">
import * as THREE from "three"
import { DimAppFrontend } from "https://esm.sh/gh/jeff-hykin/dim-app@v0.3.0/frontend.js"

// ── colormaps: t in [0,1] -> [r,g,b] (0..1) ──
const clamp01 = (x) => Math.min(1, Math.max(0, x))
const GRADIENTS = {
  turbo: (t) => [clamp01(1.0 - Math.abs(2.4 * t - 1.7)), clamp01(1.0 - Math.abs(2.4 * t - 1.2)), clamp01(1.0 - Math.abs(2.4 * t - 0.4))],
  viridis: (t) => [clamp01(0.28 + t * (0.99 - 0.28)) * (0.4 + 0.6 * t), clamp01(0.02 + t * 0.88), clamp01(0.33 + Math.sin(t * 3.14) * 0.3 - t * 0.2)],
  cool: (t) => [0.1 + 0.1 * t, 0.4 + 0.6 * t, 1.0 - 0.2 * t],
  inferno: (t) => [clamp01(t * 1.6), clamp01(t * t * 1.1 - 0.1), clamp01(0.3 * Math.sin(t * 3.14) + t * t * 0.3)],
  grayscale: (t) => [0.15 + 0.85 * t, 0.15 + 0.85 * t, 0.15 + 0.85 * t],
}
const GRAD_NAMES = Object.keys(GRADIENTS)
// Each new cloud stream starts on a different gradient so clouds are easy to tell apart.
function nextDefaultGradient() {
    const used = [...known.values()].filter((s) => s.grad).length
    return GRAD_NAMES[used % GRAD_NAMES.length]
}

// ── three.js scene (ROS convention: Z up) ──
const host = document.getElementById("scene")
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true })
renderer.setClearColor(0x000000, 0)   // transparent: the theme-aware CSS gradient shows through
renderer.setPixelRatio(Math.min(2, devicePixelRatio))
host.appendChild(renderer.domElement)
const scene = new THREE.Scene()
const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 5000)
camera.up.set(0, 0, 1)

// ── first-person fly controls: WASD move, click-drag to look ──
const look = { yaw: 0, pitch: 0 }
function viewDir() {
    const cosPitch = Math.cos(look.pitch)
    return new THREE.Vector3(cosPitch * Math.cos(look.yaw), cosPitch * Math.sin(look.yaw), Math.sin(look.pitch))
}
function setLookFrom(position, target) {
    camera.position.copy(position)
    const dir = new THREE.Vector3().subVectors(target, position).normalize()
    look.yaw = Math.atan2(dir.y, dir.x)
    look.pitch = Math.asin(THREE.MathUtils.clamp(dir.z, -1, 1))
}
setLookFrom(new THREE.Vector3(6, -6, 4), new THREE.Vector3(0, 0, 0))
const heldKeys = new Set()
window.addEventListener("keydown", (e) => {
    if (e.target instanceof HTMLSelectElement || e.target instanceof HTMLInputElement) return
    heldKeys.add(e.code)
    if (e.code === "Space") e.preventDefault()
})
window.addEventListener("keyup", (e) => heldKeys.delete(e.code))
window.addEventListener("blur", () => heldKeys.clear())
let dragButton = -1   // 0 = look, 2 = pan
renderer.domElement.addEventListener("pointerdown", (e) => {
    dragButton = e.button
    // Synthetic pointer events (automated tests) have no active pointer to capture.
    try { renderer.domElement.setPointerCapture(e.pointerId) } catch { /* InvalidPointerId */ }
})
renderer.domElement.addEventListener("pointerup", () => { dragButton = -1 })
renderer.domElement.addEventListener("pointercancel", () => { dragButton = -1 })
renderer.domElement.addEventListener("pointermove", (e) => {
    if (dragButton === -1) return
    if (e.buttons === 0) { dragButton = -1; return }   // missed pointerup (e.g. released off-window)
    if (dragButton === 0 && e.altKey) {
        // Alt+drag: pan along the camera's sideways axis and world Z only
        // (never tilted, unlike right-drag's screen-up pan).
        const forward = viewDir()
        const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize()
        camera.position.addScaledVector(right, -e.movementX * 0.015)
        camera.position.z += e.movementY * 0.015
    } else if (dragButton === 0) {
        // Grab-the-world: the scene follows the cursor. Pitch stays inside ±80°
        // so looking near straight up/down can never turn yaw into apparent roll.
        look.yaw += e.movementX * 0.0025
        look.pitch = THREE.MathUtils.clamp(look.pitch + e.movementY * 0.0025, -1.4, 1.4)
    } else if (dragButton === 2) {
        const forward = viewDir()
        const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize()
        const screenUp = new THREE.Vector3().crossVectors(right, forward)
        camera.position.addScaledVector(right, -e.movementX * 0.015)
        camera.position.addScaledVector(screenUp, e.movementY * 0.015)
    }
})
renderer.domElement.addEventListener("contextmenu", (e) => e.preventDefault())
// Scroll = fly forward/back along the view direction, same as W/S.
// Per-event clamp keeps trackpad momentum flings from teleporting the camera.
renderer.domElement.addEventListener("wheel", (e) => {
    camera.position.addScaledVector(viewDir(), THREE.MathUtils.clamp(-e.deltaY * 0.01, -1, 1))
}, { passive: true })
let homeTarget = new THREE.Vector3(0, 0, 0)
renderer.domElement.addEventListener("dblclick", () => {
    setLookFrom(new THREE.Vector3(homeTarget.x + 6, homeTarget.y - 6, homeTarget.z + 4), homeTarget)
})
function updateCamera(dt) {
    const forward = viewDir()
    const right = new THREE.Vector3().crossVectors(forward, camera.up).normalize()
    const speed = (heldKeys.has("ShiftLeft") || heldKeys.has("ShiftRight") ? 15 : 5) * dt
    if (heldKeys.has("KeyW")) camera.position.addScaledVector(forward, speed)
    if (heldKeys.has("KeyS")) camera.position.addScaledVector(forward, -speed)
    if (heldKeys.has("KeyA")) camera.position.addScaledVector(right, -speed)
    if (heldKeys.has("KeyD")) camera.position.addScaledVector(right, speed)
    if (heldKeys.has("KeyE") || heldKeys.has("Space")) camera.position.z += speed
    if (heldKeys.has("KeyQ")) camera.position.z -= speed
    camera.lookAt(new THREE.Vector3().addVectors(camera.position, forward))
}
// Grid + lighting follow the light/dark theme (read the media query directly so
// we don't depend on the class-toggle listener order).
const THEME = {
  dark:  { grid1: 0x2b3a44, grid2: 0x19242b, sky: 0xbfd8ff, ground: 0x101820 },
  light: { grid1: 0x9aa7b2, grid2: 0xc3ccd4, sky: 0xffffff, ground: 0xb6c2ce },
}
const isDark = () => !matchMedia("(prefers-color-scheme: light)").matches
let grid = null, hemi = null
function applyTheme() {
  const t = isDark() ? THEME.dark : THEME.light
  if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose() }
  grid = new THREE.GridHelper(40, 40, t.grid1, t.grid2)
  grid.rotation.x = Math.PI / 2   // grid in the XY (ground) plane for Z-up
  scene.add(grid)
  if (hemi) scene.remove(hemi)
  hemi = new THREE.HemisphereLight(t.sky, t.ground, 1.1)
  scene.add(hemi)
}
applyTheme()
// Solid cylinder axes instead of AxesHelper: 1px lines lying in the grid plane
// z-fight with the GridHelper; real thickness (and a tiny z lift) avoids that.
function makeAxes(length, radius) {
    const axesGroup = new THREE.Group()
    const axisSpecs = [
        { color: 0xef4444, dir: new THREE.Vector3(1, 0, 0) },
        { color: 0x22c55e, dir: new THREE.Vector3(0, 1, 0) },
        { color: 0x3b82f6, dir: new THREE.Vector3(0, 0, 1) },
    ]
    for (const { color, dir } of axisSpecs) {
        const rod = new THREE.Mesh(
            new THREE.CylinderGeometry(radius, radius, length, 12),
            new THREE.MeshBasicMaterial({ color }),
        )
        rod.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir)
        rod.position.copy(dir).multiplyScalar(length / 2)
        axesGroup.add(rod)
    }
    axesGroup.position.z = 0.002
    return axesGroup
}
scene.add(makeAxes(1.5, 0.02))

// A few landmark props so an empty scene still reads spatially (Z-up).
{
    const propMaterial = (color) => new THREE.MeshStandardMaterial({ color, metalness: 0.1, roughness: 0.7 })
    const crate = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), propMaterial(0x8a6d3b))
    crate.position.set(3, 2, 0.3)
    const smallCrate = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), propMaterial(0x7a5cb8))
    smallCrate.position.set(3.6, 1.5, 0.2)
    const drum = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.8, 24), propMaterial(0x3b82a0))
    drum.rotation.x = Math.PI / 2
    drum.position.set(-2.5, 3, 0.4)
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.7, 24), propMaterial(0xd97a3d))
    cone.rotation.x = Math.PI / 2
    cone.position.set(1.5, -2.8, 0.35)
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 16), propMaterial(0x4caf7d))
    ball.position.set(-3, -2, 0.3)
    scene.add(crate, smallCrate, drum, cone, ball)
}
matchMedia("(prefers-color-scheme: light)").addEventListener("change", () => setTimeout(applyTheme, 0))

const BASE_VFOV = 60, MAX_HFOV = 100   // degrees; wide windows would otherwise hit ~130° horizontal
function resize() {
  const w = host.clientWidth, h = host.clientHeight
  // updateStyle must stay true: without CSS sizing the canvas displays at its
  // attribute size (w × pixelRatio), i.e. double-size on retina, clipped to the
  // top-left quarter — which put the scene center at the window's bottom-right.
  renderer.setSize(w, h)
  camera.aspect = w / h
  // Cap the horizontal FOV: on very wide windows keep hfov ≤ MAX_HFOV by
  // shrinking the vertical fov, so edges don't get fisheye-stretched.
  const halfH = Math.atan(Math.tan(THREE.MathUtils.degToRad(BASE_VFOV) / 2) * camera.aspect)
  camera.fov = halfH > THREE.MathUtils.degToRad(MAX_HFOV) / 2
    ? THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(MAX_HFOV) / 2) / camera.aspect))
    : BASE_VFOV
  camera.updateProjectionMatrix()
}
new ResizeObserver(resize).observe(host); resize()
const clock = new THREE.Clock()
const camposEl = document.getElementById("campos")
;(function loop() {
    requestAnimationFrame(loop)
    updateCamera(Math.min(clock.getDelta(), 0.1))
    camposEl.textContent = ` · CAM ${camera.position.x.toFixed(1)},${camera.position.y.toFixed(1)},${camera.position.z.toFixed(1)} YAW ${(look.yaw * 57.3).toFixed(0)}° PITCH ${(look.pitch * 57.3).toFixed(0)}°`
    renderer.render(scene, camera)
})()

// ── TF tree: child -> { parent, matrix(T_parent_child) } ──
const tf = new Map()
const tmpV = new THREE.Vector3(), tmpQ = new THREE.Quaternion()
function setTf(parent, child, t, q) {
  const m = new THREE.Matrix4().compose(tmpV.set(t[0], t[1], t[2]), tmpQ.set(q[0], q[1], q[2], q[3]), { x: 1, y: 1, z: 1 })
  tf.set(child, { parent, matrix: m })
}
function worldMatrix(frame) {
  const chain = []
  let f = frame, guard = 0
  while (f && tf.has(f) && guard++ < 64) { const e = tf.get(f); chain.push(e.matrix); f = e.parent }
  const m = new THREE.Matrix4()
  for (let i = chain.length - 1; i >= 0; i--) m.multiply(chain[i])
  return m
}

function b64ToBuf(b64) {
  const bin = atob(b64); const u = new Uint8Array(bin.length)
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i)
  return u.buffer
}

// ── point clouds (lidar, costmap) ──
const clouds = new Map()   // stream -> { points, geom, frame }
function ensureCloud(stream) {
  let c = clouds.get(stream)
  if (c) return c
  const geom = new THREE.BufferGeometry()
  geom.setAttribute("position", new THREE.BufferAttribute(new Float32Array(0), 3))
  geom.setAttribute("color", new THREE.BufferAttribute(new Float32Array(0), 3))
  const mat = new THREE.PointsMaterial({ size: 0.04, vertexColors: true, sizeAttenuation: true })
  const points = new THREE.Points(geom, mat)
  points.matrixAutoUpdate = false
  scene.add(points)
  c = { points, geom, frame: "", stream }
  clouds.set(stream, c)
  return c
}
function recolor(c) {
  const pos = c.geom.getAttribute("position"); if (!pos || !pos.count) return
  const col = c.geom.getAttribute("color")
  const arr = pos.array, n = pos.count
  const streamEntry = known.get(c.stream)
  const axisIdx = streamEntry?.axis ?? 2
  let lo = Infinity, hi = -Infinity
  for (let i = 0; i < n; i++) { const v = arr[i * 3 + axisIdx]; if (v < lo) lo = v; if (v > hi) hi = v }
  const span = hi > lo ? hi - lo : 1
  const g = GRADIENTS[streamEntry?.grad] || GRADIENTS.turbo
  const cArr = col.array
  for (let i = 0; i < n; i++) {
    const [r, gg, b] = g((arr[i * 3 + axisIdx] - lo) / span)
    cArr[i * 3] = r; cArr[i * 3 + 1] = gg; cArr[i * 3 + 2] = b
  }
  col.needsUpdate = true
}
function onCloud(p) {
  const c = ensureCloud(p.stream)
  c.frame = p.frame
  const xyz = new Float32Array(b64ToBuf(p.b64))
  c.geom.setAttribute("position", new THREE.BufferAttribute(xyz, 3))
  c.geom.setAttribute("color", new THREE.BufferAttribute(new Float32Array(xyz.length), 3))
  c.geom.computeBoundingSphere()
  recolor(c)
  c.points.matrix.copy(worldMatrix(p.frame))
  refreshStreams()
}

// ── odometry: robot body + pose gizmo + trail per stream ──
const odoms = new Map()  // stream -> { group, trail, positions[], geom }
function ensureOdom(stream) {
  let o = odoms.get(stream)
  if (o) return o
  const group = new THREE.Group(); group.matrixAutoUpdate = false
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.5, 0.28, 0.22),
    new THREE.MeshStandardMaterial({ color: 0xffb454, metalness: 0.1, roughness: 0.6 }))
  body.position.z = 0.11
  group.add(body); group.add(makeAxes(0.6, 0.012))
  const trailGeom = new THREE.BufferGeometry()
  trailGeom.setAttribute("position", new THREE.BufferAttribute(new Float32Array(3 * 4000), 3))
  trailGeom.setDrawRange(0, 0)
  const trail = new THREE.Line(trailGeom, new THREE.LineBasicMaterial({ color: 0x45e0ff }))
  scene.add(group); scene.add(trail)
  o = { group, trail, positions: [], geom: trailGeom }
  odoms.set(stream, o)
  return o
}
let framed = false
function onOdom(p) {
  const o = ensureOdom(p.stream)
  const pose = new THREE.Matrix4().compose(
    tmpV.set(p.pos[0], p.pos[1], p.pos[2]), tmpQ.set(p.quat[0], p.quat[1], p.quat[2], p.quat[3]), { x: 1, y: 1, z: 1 })
  const world = worldMatrix(p.frame).multiply(pose)
  o.group.matrix.copy(world)
  const wp = new THREE.Vector3().setFromMatrixPosition(world)
  homeTarget.copy(wp)
  // Frame the robot once when it first appears; after that the camera is free-fly.
  if (!framed) {
    setLookFrom(new THREE.Vector3(wp.x + 7, wp.y - 7, wp.z + 5), wp)
    framed = true
  }
  o.positions.push(wp.x, wp.y, wp.z)
  if (o.positions.length > 3 * 4000) o.positions.splice(0, 3)
  const arr = o.geom.getAttribute("position").array
  arr.set(o.positions)
  o.geom.getAttribute("position").needsUpdate = true
  o.geom.setDrawRange(0, o.positions.length / 3)
  refreshStreams()
}

// ── planned path per stream ──
const paths = new Map()   // stream -> { line, geom }
function ensurePath(stream) {
  let pa = paths.get(stream)
  if (pa) return pa
  const geom = new THREE.BufferGeometry()
  geom.setAttribute("position", new THREE.BufferAttribute(new Float32Array(3 * 4000), 3))
  geom.setDrawRange(0, 0)
  const line = new THREE.Line(geom, new THREE.LineBasicMaterial({ color: 0x7CFF6B, linewidth: 2 }))
  line.matrixAutoUpdate = false
  scene.add(line)
  pa = { line, geom }
  paths.set(stream, pa)
  return pa
}
function onPath(p) {
  const pa = ensurePath(p.stream)
  const xyz = new Float32Array(b64ToBuf(p.b64))
  const cap = pa.geom.getAttribute("position")
  if (xyz.length > cap.array.length) {
    pa.geom.setAttribute("position", new THREE.BufferAttribute(xyz.slice(), 3))
  } else {
    cap.array.set(xyz); cap.needsUpdate = true
  }
  pa.geom.setDrawRange(0, xyz.length / 3)
  pa.line.matrix.copy(worldMatrix(p.frame))
  refreshStreams()
}

// ── camera stream overlays ──
// One draggable/foldable/resizable window per image stream. Position, width,
// and folded state persist in localStorage keyed by stream name.
const camViews = new Map()   // stream -> { box, canvas, ctx, raw }
let camTopZ = 30
const camStateKey = (stream) => "lv-cam:" + stream
function ensureCamView(stream) {
    let view = camViews.get(stream)
    if (view) return view
    const box = document.createElement("div")
    box.className = "cam"
    const head = document.createElement("div")
    head.className = "cam-head"
    head.innerHTML = `<span class="cam-title"></span><span class="fold-chev">▼</span>`
    head.querySelector(".cam-title").textContent = stream.split("#")[0]
    const canvas = document.createElement("canvas")
    canvas.width = 320; canvas.height = 180
    const grip = document.createElement("div")
    grip.className = "cam-resize"
    box.append(head, canvas, grip)
    document.body.appendChild(box)
    let saved = null
    try { saved = JSON.parse(localStorage.getItem(camStateKey(stream))) } catch { /* corrupt entry */ }
    const width = saved?.w || 300
    // New views cascade up-left from the bottom-right corner so every header stays visible.
    const defaultY = innerHeight - 260 - camViews.size * 34
    box.style.width = width + "px"
    box.style.left = THREE.MathUtils.clamp(saved?.x ?? (innerWidth - width - 14 - camViews.size * 34), 0, Math.max(0, innerWidth - 80)) + "px"
    box.style.top = THREE.MathUtils.clamp(saved?.y ?? defaultY, 0, Math.max(0, innerHeight - 40)) + "px"
    if (saved?.folded) box.classList.add("folded")
    // New windows spawn beneath existing ones (so the cascade keeps every header
    // peeking out); any interaction brings a window to the front.
    box.style.zIndex = String(30 - camViews.size)
    box.addEventListener("pointerdown", () => { box.style.zIndex = String(++camTopZ) })
    const save = () => localStorage.setItem(camStateKey(stream), JSON.stringify({
        x: parseFloat(box.style.left), y: parseFloat(box.style.top),
        w: parseFloat(box.style.width), folded: box.classList.contains("folded"),
    }))
    // Drag the header to move; a click with (almost) no movement toggles fold.
    head.addEventListener("pointerdown", (e) => {
        e.preventDefault()
        const startLeft = parseFloat(box.style.left), startTop = parseFloat(box.style.top)
        const startX = e.clientX, startY = e.clientY
        let moved = 0
        const onMove = (ev) => {
            moved += Math.abs(ev.movementX) + Math.abs(ev.movementY)
            box.style.left = (startLeft + ev.clientX - startX) + "px"
            box.style.top = (startTop + ev.clientY - startY) + "px"
        }
        const onUp = () => {
            removeEventListener("pointermove", onMove); removeEventListener("pointerup", onUp)
            if (moved < 5) box.classList.toggle("folded")
            save()
        }
        addEventListener("pointermove", onMove); addEventListener("pointerup", onUp)
    })
    // Drag the corner grip to resize (width only; height follows the frame aspect).
    grip.addEventListener("pointerdown", (e) => {
        e.preventDefault(); e.stopPropagation()
        const startWidth = parseFloat(box.style.width), startX = e.clientX
        const onMove = (ev) => { box.style.width = Math.max(120, startWidth + ev.clientX - startX) + "px" }
        const onUp = () => { removeEventListener("pointermove", onMove); removeEventListener("pointerup", onUp); save() }
        addEventListener("pointermove", onMove); addEventListener("pointerup", onUp)
    })
    view = { box, canvas, ctx: canvas.getContext("2d"), raw: null }
    camViews.set(stream, view)
    return view
}
function onFrame(p) {
  const view = ensureCamView(p.stream)
  const { canvas, ctx } = view
  if (p.kind === "compressed") {
    const img = new Image()
    img.onload = () => {
      if (canvas.width !== img.width || canvas.height !== img.height) { canvas.width = img.width; canvas.height = img.height }
      ctx.drawImage(img, 0, 0)
    }
    img.src = `data:image/${(p.format || "jpeg").replace(/[^a-z0-9]/gi, "") || "jpeg"};base64,${p.b64}`
    return
  }
  // raw Image: rgb8 / bgr8 / rgba8 / mono8
  const w = p.width, h = p.height; if (!w || !h) return
  const src = new Uint8Array(b64ToBuf(p.b64))
  const enc = (p.encoding || "rgb8").toLowerCase()
  const ch = enc === "rgba8" ? 4 : enc === "mono8" ? 1 : 3
  const step = p.step || w * ch
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; view.raw = null }
  if (!view.raw) view.raw = ctx.createImageData(w, h)
  const dst = view.raw.data
  const bgr = enc === "bgr8" || enc === "bgra8"
  for (let y = 0; y < h; y++) {
    let si = y * step, di = y * w * 4
    for (let x = 0; x < w; x++) {
      if (ch === 1) { const v = src[si]; dst[di] = v; dst[di + 1] = v; dst[di + 2] = v; dst[di + 3] = 255; si += 1 }
      else {
        const r = src[si + (bgr ? 2 : 0)], g = src[si + 1], b = src[si + (bgr ? 0 : 2)]
        dst[di] = r; dst[di + 1] = g; dst[di + 2] = b; dst[di + 3] = 255; si += ch
      }
      di += 4
    }
  }
  ctx.putImageData(view.raw, 0, 0)
}

// ── stream checklist ──
const known = new Map()   // name -> { kind, on }
function setVisible(name, on) {
  const c = clouds.get(name); if (c) c.points.visible = on
  const o = odoms.get(name); if (o) { o.group.visible = on; o.trail.visible = on }
  const pa = paths.get(name); if (pa) pa.line.visible = on
  const v = camViews.get(name); if (v) v.box.style.display = on ? "" : "none"
}
function refreshStreams() {
  const list = document.getElementById("stream-list")
  if (!known.size) { list.innerHTML = '<div class="empty">none yet</div>'; return }
  const rows = [...known.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([name, s]) => {
    const axis = s.axis ?? 2
    const control = s.kind === "cloud"
      ? `<select class="grad-pick" data-g="${encodeURIComponent(name)}">` +
        GRAD_NAMES.map((g) => `<option value="${g}" ${g === s.grad ? "selected" : ""}>${g}</option>`).join("") + `</select>` +
        `<select class="grad-pick axis-pick" data-a="${encodeURIComponent(name)}">` +
        [["2", "z"], ["0", "x"], ["1", "y"]].map(([v, l]) => `<option value="${v}" ${+v === axis ? "selected" : ""}>${l}</option>`).join("") + `</select>`
      : `<span class="tag kc-${s.kind}">${s.kind}</span>`
    return `<div class="row"><label><input type="checkbox" data-s="${encodeURIComponent(name)}" ${s.on ? "checked" : ""}>` +
      `<span class="nm">${name.split("#")[0].replace(/[&<>]/g, "")}</span></label>${control}</div>`
  }).join("")
  if (list.dataset.sig !== rows) { list.dataset.sig = rows; list.innerHTML = rows }
}
document.getElementById("stream-list").addEventListener("change", (e) => {
  const gradPick = e.target.closest("select[data-g]")
  const axisPick = e.target.closest("select[data-a]")
  if (gradPick || axisPick) {
    const name = decodeURIComponent(gradPick ? gradPick.dataset.g : axisPick.dataset.a)
    const s = known.get(name)
    if (s) {
      if (gradPick) s.grad = gradPick.value
      else s.axis = +axisPick.value
      const c = clouds.get(name); if (c) recolor(c)
      refreshStreams()
    }
    return
  }
  const cb = e.target.closest("input[data-s]"); if (!cb) return
  const name = decodeURIComponent(cb.dataset.s)
  const s = known.get(name); if (s) { s.on = cb.checked; setVisible(name, cb.checked) }
})
function addStream(name, kind) {
  const cur = known.get(name)
  if (!cur) {
    const entry = { kind: kind || "…", on: true }
    if (kind === "cloud") entry.grad = nextDefaultGradient()
    known.set(name, entry); refreshStreams()
  } else if (kind && cur.kind !== kind) {
    cur.kind = kind
    if (kind === "cloud" && !cur.grad) cur.grad = nextDefaultGradient()
    refreshStreams()
  }
}

// ── controls ──
document.getElementById("topbar").addEventListener("click", () => document.body.classList.toggle("panel-hidden"))

// ── app bus ──
let bridgeUp = false
const pill = document.getElementById("pill"), statEl = document.getElementById("stat")
function setStatus() { pill.classList.toggle("on", bridgeUp); statEl.textContent = bridgeUp ? `live · ${known.size} streams` : "waiting for bridge…" }
const dimApp = new DimAppFrontend()
const handleAppMessage = (kind, p) => {
  if (kind === "status") { bridgeUp = !!p.bridge; setStatus() }
  else if (kind === "streams") { for (const s of p.streams || []) addStream(s.name, s.kind); setStatus() }
  else if (kind === "tf") { for (const t of p.transforms || []) setTf(t.parent, t.child, t.t, t.q) }
  else if (kind === "cloud") { addStream(p.stream, "cloud"); if (known.get(p.stream)?.on !== false) onCloud(p); setStatus() }
  else if (kind === "odom") { addStream(p.stream, "odom"); if (known.get(p.stream)?.on !== false) onOdom(p); setStatus() }
  else if (kind === "path") { addStream(p.stream, "path"); if (known.get(p.stream)?.on !== false) onPath(p); setStatus() }
  else if (kind === "frame") { addStream(p.stream, "image"); onFrame(p); setStatus() }
}
dimApp.receiveRequest(handleAppMessage)
window.__lv_inject = handleAppMessage   // manual/automated testing without a robot
dimApp.send("hello"); setStatus()
</script>
</body>
</html>
